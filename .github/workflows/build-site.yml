name: Publicar blog e páginas

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'index.html'
      - 'scripts/**'
  schedule:
    - cron: '7 9 * * *'   # todo dia às 06:07 (Brasília): publica posts agendados
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar páginas, blog e sitemap
        run: python3 scripts/build.py
      - name: Salvar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git commit -m "Atualiza blog e páginas geradas"
            git push
          fi
